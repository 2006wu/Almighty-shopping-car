# Explicit opt-in micro-ROS XRCE serial agent, NOT the plain-serial fallback.
# Set MICROROS_SERIAL_DEVICE explicitly, copy this file and uncomment devices only after confirming the physical port.
# No device mapping is enabled in the distributed override.
services:
  microros_agent:
    command: [serial, --dev, '${MICROROS_SERIAL_DEVICE:?Explicit serial device opt-in required}', -b, '115200', -v4]
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0
