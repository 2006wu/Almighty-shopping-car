name: almighty-shopping-car
x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-28}
  ROS_LOCALHOST_ONLY: "0"
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  FASTRTPS_DEFAULT_PROFILES_FILE: /etc/fastdds_udp.xml
  LIBGL_ALWAYS_SOFTWARE: "1"
x-runtime: &runtime
  # One shared runtime image per compose project, so worktrees/projects stay isolated.
  image: ${COMPOSE_PROJECT_NAME:-almighty-shopping-car}-compute
  build:
    context: ..
    dockerfile: docker/Dockerfile.compute
    args:
      ROS_APT_MIRROR: ${ROS_APT_MIRROR:-}
  init: true
  working_dir: /ws
  shm_size: 1gb
  environment: *ros-env
  volumes:
    - ../ros2_ws/src:/ws/src
    - ../third_party/eurobot_nav2/src:/nav2_ws/src:ro
    - nav2_build:/nav2_ws/build
    - nav2_install:/nav2_ws/install
    - nav2_log:/nav2_ws/log
    - ..:/repo
    - build:/ws/build
    - install:/ws/install
    - log:/ws/log
    - ./fastdds_udp.xml:/etc/fastdds_udp.xml:ro
services:
  compute:
    <<: *runtime
    # The display shares this network namespace, so its noVNC/VNC ports are published here.
    ports:
      - 127.0.0.1:${NOVNC_HOST_PORT:-6080}:6080
      - 127.0.0.1:${VNC_HOST_PORT:-5910}:5900
    networks: [ros]
    healthcheck:
      test: [CMD-SHELL, "test -r /opt/ros/humble/setup.bash && test -d /ws/src && kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 3
  microros_agent:
    image: microros/micro-ros-agent:humble
    profiles: [comm]
    command: [udp4, -p, '8888', -v4]
    environment: *ros-env
    volumes:
      - ./fastdds_udp.xml:/etc/fastdds_udp.xml:ro
    network_mode: service:compute
    depends_on:
      compute: {condition: service_healthy}
    # UDP 8888 is intentionally internal; no device access or host port by default.
  microros_client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.microros-client
    profiles: [comm]
    init: true
    restart: on-failure
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-28}
      RMW_IMPLEMENTATION: rmw_microxrcedds
      MICROROS_AGENT_HOST: 127.0.0.1
      MICROROS_AGENT_PORT: '8888'
    depends_on: [microros_agent]
    network_mode: service:compute
    # Linux simulation only: UDP to the agent, no devices or published ports.
  sim:
    <<: *runtime
    profiles: [split]
    environment: &split-env
      <<: *ros-env
      SPLIT_MODE: ${SPLIT_MODE:-guide}
      SPLIT_LAUNCH_ARGS: ${SPLIT_LAUNCH_ARGS:-}
    network_mode: service:compute
    depends_on:
      compute: {condition: service_healthy}
    command: [bash, /repo/scripts/split_role.sh, sim]
    healthcheck:
      test: [CMD, python3, /repo/scripts/sim_health.py]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 20s
  localization:
    <<: *runtime
    profiles: [split]
    environment: *split-env
    network_mode: service:compute
    depends_on:
      sim: {condition: service_healthy}
    command: [bash, /repo/scripts/split_role.sh, localization]
  navigation:
    <<: *runtime
    profiles: [split]
    environment: *split-env
    network_mode: service:compute
    depends_on:
      sim: {condition: service_healthy}
      localization: {condition: service_started}
    command: [bash, /repo/scripts/split_role.sh, navigation]
  app:
    <<: *runtime
    profiles: [split]
    environment: *split-env
    network_mode: service:compute
    depends_on:
      sim: {condition: service_healthy}
      localization: {condition: service_started}
      navigation: {condition: service_started}
    command: [bash, /repo/scripts/split_role.sh, app]
  record:
    <<: *runtime
    profiles: [record]
    network_mode: service:compute
    depends_on:
      compute: {condition: service_healthy}
    command: [sleep, infinity]
  display:
    build:
      context: ..
      dockerfile: docker/Dockerfile.display
      args:
        ROS_APT_MIRROR: ${ROS_APT_MIRROR:-}
    init: true
    environment:
      <<: *ros-env
      DISPLAY: :99
      QT_X11_NO_MITSHM: "1"
      VNC_PASSWORD: ${VNC_PASSWORD:-shopping}
      AUTOSTART_RVIZ: ${AUTOSTART_RVIZ:-0}
    volumes:
      - ../ros2_ws/src:/ws/src:ro
      - build:/ws/build:ro
      - install:/ws/install:ro
      - ./fastdds_udp.xml:/etc/fastdds_udp.xml:ro
    # Share the compute network namespace: DDS discovery and Gazebo transport then work without
    # relying on multicast across a Docker bridge (unreliable on some hosts).
    network_mode: service:compute
    depends_on:
      compute: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "xdpyinfo -display :99 >/dev/null && pgrep -x openbox >/dev/null && nc -z 127.0.0.1 5900 && nc -z 127.0.0.1 6080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  ros: {driver: bridge}
volumes:
  build:
  install:
  log:
  nav2_build:
  nav2_install:
  nav2_log:
