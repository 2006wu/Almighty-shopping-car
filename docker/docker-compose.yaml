name: almighty-shopping-car
x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-28}
  ROS_LOCALHOST_ONLY: "0"
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  FASTRTPS_DEFAULT_PROFILES_FILE: /etc/fastdds_udp.xml
  LIBGL_ALWAYS_SOFTWARE: "1"
services:
  compute:
    build:
      context: ..
      dockerfile: docker/Dockerfile.compute
      args:
        ROS_APT_MIRROR: ${ROS_APT_MIRROR:-}
    init: true
    working_dir: /ws
    shm_size: 1gb
    environment: *ros-env
    volumes:
      - ../ros2_ws/src:/ws/src
      - ..:/repo
      - build:/ws/build
      - install:/ws/install
      - log:/ws/log
      - ./fastdds_udp.xml:/etc/fastdds_udp.xml:ro
    networks: [ros]
    healthcheck:
      test: [CMD-SHELL, "test -r /opt/ros/humble/setup.bash && test -d /ws/src && kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 3
  display:
    build:
      context: ..
      dockerfile: docker/Dockerfile.display
      args:
        ROS_APT_MIRROR: ${ROS_APT_MIRROR:-}
    init: true
    environment:
      <<: *ros-env
      DISPLAY: :99
      QT_X11_NO_MITSHM: "1"
      VNC_PASSWORD: ${VNC_PASSWORD:-shopping}
      AUTOSTART_RVIZ: ${AUTOSTART_RVIZ:-0}
    ports:
      - 127.0.0.1:6080:6080
      - 127.0.0.1:5910:5900
    volumes:
      - ../ros2_ws/src:/ws/src:ro
      - build:/ws/build:ro
      - install:/ws/install:ro
      - ./fastdds_udp.xml:/etc/fastdds_udp.xml:ro
    depends_on:
      compute: {condition: service_healthy}
    networks: [ros]
    healthcheck:
      test: [CMD-SHELL, "xdpyinfo -display :99 >/dev/null && pgrep -x openbox >/dev/null && nc -z 127.0.0.1 5900 && nc -z 127.0.0.1 6080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  ros: {driver: bridge}
volumes:
  build:
  install:
  log:
