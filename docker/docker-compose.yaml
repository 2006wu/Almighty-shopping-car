name: almighty-shopping-car
x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-28}
  ROS_LOCALHOST_ONLY: "0"
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  FASTRTPS_DEFAULT_PROFILES_FILE: /etc/fastdds_udp.xml
  LIBGL_ALWAYS_SOFTWARE: "1"
services:
  compute:
    build:
      context: ..
      dockerfile: docker/Dockerfile.compute
      args:
        ROS_APT_MIRROR: ${ROS_APT_MIRROR:-}
    init: true
    working_dir: /ws
    shm_size: 1gb
    environment: *ros-env
    volumes:
      - ../ros2_ws/src:/ws/src
      - ../third_party/eurobot_nav2/src:/nav2_ws/src:ro
      - nav2_build:/nav2_ws/build
      - nav2_install:/nav2_ws/install
      - nav2_log:/nav2_ws/log
      - ..:/repo
      - build:/ws/build
      - install:/ws/install
      - log:/ws/log
      - ./fastdds_udp.xml:/etc/fastdds_udp.xml:ro
    # The display shares this network namespace, so its noVNC/VNC ports are published here.
    ports:
      - 127.0.0.1:${NOVNC_HOST_PORT:-6080}:6080
      - 127.0.0.1:${VNC_HOST_PORT:-5910}:5900
    networks: [ros]
    healthcheck:
      test: [CMD-SHELL, "test -r /opt/ros/humble/setup.bash && test -d /ws/src && kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 3
  microros_agent:
    image: microros/micro-ros-agent:humble
    profiles: [comm]
    command: [udp4, -p, '8888', -v4]
    environment: *ros-env
    volumes:
      - ./fastdds_udp.xml:/etc/fastdds_udp.xml:ro
    networks: [ros]
    # UDP 8888 is intentionally internal; no device access or host port by default.
  display:
    build:
      context: ..
      dockerfile: docker/Dockerfile.display
      args:
        ROS_APT_MIRROR: ${ROS_APT_MIRROR:-}
    init: true
    environment:
      <<: *ros-env
      DISPLAY: :99
      QT_X11_NO_MITSHM: "1"
      VNC_PASSWORD: ${VNC_PASSWORD:-shopping}
      AUTOSTART_RVIZ: ${AUTOSTART_RVIZ:-0}
    volumes:
      - ../ros2_ws/src:/ws/src:ro
      - build:/ws/build:ro
      - install:/ws/install:ro
      - ./fastdds_udp.xml:/etc/fastdds_udp.xml:ro
    # Share the compute network namespace: DDS discovery and Gazebo transport then work without
    # relying on multicast across a Docker bridge (unreliable on some hosts).
    network_mode: service:compute
    depends_on:
      compute: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "xdpyinfo -display :99 >/dev/null && pgrep -x openbox >/dev/null && nc -z 127.0.0.1 5900 && nc -z 127.0.0.1 6080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  ros: {driver: bridge}
volumes:
  build:
  install:
  log:
  nav2_build:
  nav2_install:
  nav2_log:
