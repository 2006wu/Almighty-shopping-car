[platformio]
default_envs = nucleo_f446re

[env]
platform = ststm32
framework = arduino
lib_deps = frankjoshua/Rosserial Arduino Library@^0.9.1
upload_protocol = stlink

[env:nucleo_f446re]
board = nucleo_f446re

