[platformio]
default_envs = nucleo_g431rb

[env]
platform = ststm32@20.0.0
framework = arduino
lib_deps = frankjoshua/Rosserial Arduino Library@^0.9.1
upload_protocol = stlink

; TODO(hardware): Confirm the assumed Nucleo-G431RB board before upload.
[env:nucleo_g431rb]
board = nucleo_g431rb

