ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 40.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    world_frame: odom
    base_link_frame: base_footprint
    odom0: /wheel_odom_noisy
    # Order: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az.
    # Fuse velocities only: wheel pose is an integration of the same encoders.
    odom0_config: [false, false, false, false, false, false,
                   true, false, false, false, false, true, false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    imu0: /imu/with_covariance
    # No absolute yaw from a six-axis IMU; no acceleration/gravity integration.
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true, false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
    reset_on_time_jump: true
